<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 300px; font-family: 'Segoe UI', Arial, sans-serif; padding: 16px; margin: 0; }
    h3 { margin: 0 0 12px 0; color: #111827; font-size: 16px; }
    .btn {
      width: 100%; padding: 10px; margin-bottom: 8px; border: none;
      border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px;
    }
    #btn-start { background: #2563eb; color: white; }
    #btn-start:hover { background: #1d4ed8; }
    #btn-stop { background: #dc2626; color: white; display: none; }
    #btn-stop:hover { background: #b91c1c; }
    #btn-view { background: #f3f4f6; color: #1f2937; border: 1px solid #d1d5db; }
    #btn-view:hover { background: #e5e7eb; }
    #counter { font-size: 13px; color: #4b5563; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <h3>Capture de Tutoriel</h3>
  <button id="btn-start" class="btn">Démarrer l'enregistrement</button>
  <button id="btn-stop" class="btn">Arrêter et voir le guide</button>
  <button id="btn-view" class="btn">Ouvrir le dernier guide</button>
  <div id="counter">0 étape enregistrée</div>
  <script src="popup.js"></script>
</body>
</html>
